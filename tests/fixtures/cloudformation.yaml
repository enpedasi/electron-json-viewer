AWSTemplateFormatVersion: "2010-09-09"
Resources:
  RegexPatternSet:
    Type: AWS::WAFv2::RegexPatternSet
    Properties:
      RegularExpressionList:
        - !Sub "^${PathPattern}*"
      Scope: REGIONAL
  MyBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketNameParam
